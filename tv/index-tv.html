<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiPantalla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0f13">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiPantalla">
<style>
:root{
  --bg:#0e0f13; --panel:#171920; --panel2:#1f222b; --text:#eceef3; --muted:#9aa0ad;
  --accent:#ff4d6d; --accent2:#ffb703; --ok:#2ec4b6; --border:#2a2d38; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(14,15,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:999px}
nav button.on{background:var(--panel2);color:var(--text)}
.search{flex:1;min-width:180px}
.search input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:999px;outline:none}
.search input:focus{border-color:var(--accent)}
.gear{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 12px}
main{max-width:1280px;margin:0 auto;padding:16px}
.notice{background:linear-gradient(90deg,#2a1520,#1d1a10);border:1px solid #4a2a33;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;color:#f3d6dc;font-size:14px}
.notice b{color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:999px;font-size:13px}
.chip.on{border-color:var(--accent);background:#2a1620}
.chip img{width:20px;height:20px;border-radius:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}
h2{font-size:18px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--panel);border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid transparent;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--border)}
/* foco visible para teclado y control remoto */
:focus{outline:none}
:focus-visible,.tv :focus{outline:4px solid var(--accent2);outline-offset:3px}
.tv .card:focus{transform:scale(1.07);z-index:2;box-shadow:0 10px 30px #000c}
/* modo tele: todo más grande para verlo desde el sillón */
.tv{font-size:20px}
.tv .bar,.tv main{max-width:none;padding-left:56px;padding-right:56px}
.tv .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.tv .meta .t{font-size:18px}.tv .meta .s{font-size:15px}
.tv h2{font-size:28px;margin-top:34px}
.tv nav button,.tv .gear,.tv .chip,.tv .btn,.tv .open,.tv select{font-size:19px;padding:12px 18px}
.tv .search input{font-size:19px;padding:12px 18px}
.tv .modal{max-width:1100px}.tv .mtitle{font-size:36px}.tv .ov{font-size:20px}
.tv .tvhint{display:block}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:14px 20px;border-radius:12px;z-index:50;box-shadow:0 8px 30px #000a;max-width:90vw}
.tvhint{display:none;color:var(--muted);font-size:15px;margin:0 0 14px}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:var(--panel2)}
.ph{aspect-ratio:2/3;min-height:220px;display:flex;align-items:flex-end;padding:10px;font-weight:700;font-size:15px}
.meta{padding:8px 10px 10px}
.meta .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{color:var(--muted);font-size:12px}
.provs{position:absolute;top:6px;left:6px;display:flex;gap:3px}
.provs img{width:22px;height:22px;border-radius:5px;box-shadow:0 1px 4px #000a}
.provs .pt{font-size:10px;background:#000c;padding:2px 5px;border-radius:5px}
.badge{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.badge.watching{background:var(--accent2);color:#111}
.badge.done{background:var(--ok);color:#111}
.progress{height:4px;background:#333}
.progress i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.more{display:block;margin:20px auto;background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:10px 22px;border-radius:999px}
/* modal */
.overlay{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;background:#000b;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:30px 16px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:820px;width:100%;overflow:hidden}
.hero{position:relative;min-height:160px;background:var(--panel2) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,var(--panel))}
.close{position:absolute;top:10px;right:10px;z-index:2;background:#000a;color:#fff;border:0;width:34px;height:34px;border-radius:50%;font-size:18px}
.mbody{padding:0 20px 22px;margin-top:-60px;position:relative;z-index:1}
.mtop{display:flex;gap:16px}
.mtop .poster{width:120px;border-radius:10px;flex:none}
.mtop .ph{width:120px;border-radius:10px;flex:none}
.mtitle{font-size:24px;font-weight:800;margin:56px 0 4px}
.sub{color:var(--muted);font-size:13px}
.ov{margin:14px 0;color:#d4d7de}
.where h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.open{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;text-decoration:none;margin:0 8px 8px 0}
.open.mine{border-color:var(--accent);background:#2a1620}
.open img{width:24px;height:24px;border-radius:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{outline:2px solid var(--accent2)}
.ep{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.ep input{width:56px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px}
/* settings */
.set label{display:block;margin:14px 0 6px;font-weight:600}
.set input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px}
.set textarea{width:100%;min-height:70px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font:12px monospace}
[hidden]{display:none!important}
.set .hint{color:var(--muted);font-size:13px}
@media (max-width:600px){
  .mtop .poster,.mtop .ph{width:90px}
  .mtitle{font-size:19px;margin-top:62px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Mi<span>Pantalla</span></div>
    <nav id="nav">
      <button data-v="home" class="on">Inicio</button>
      <button data-v="explore">Explorar</button>
      <button data-v="list">Mi lista</button>
    </nav>
    <div class="search"><input id="q" type="search" placeholder="Buscar pelis y series…" autocomplete="off"></div>
    <button class="gear" id="install" hidden>⬇ Instalar</button>
    <button class="gear" id="openSettings">⚙︎ Ajustes</button>
  </div>
</header>

<main id="main"></main>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

  }
};
const DEFAULT_SERVICES = [8, 337, 1899, 350, 119, 531];
const COUNTRIES = [['AR', 'Argentina'], ['MX', 'México'], ['ES', 'España'], ['CL', 'Chile'], ['CO', 'Colombia'], ['UY', 'Uruguay'], ['PE', 'Perú'], ['US', 'Estados Unidos'], ['BR', 'Brasil'], ['EC', 'Ecuador'], ['PY', 'Paraguay'], ['VE', 'Venezuela'], ['CR', 'Costa Rica'], ['GT', 'Guatemala'], ['DO', 'Rep. Dominicana']];

const S = {

  // clave opcional de Streaming Availability (RapidAPI) para links directos
  region: load('region', guessRegion()),
  services: load('services', DEFAULT_SERVICES),
  list: load('list', {}),
  // id -> {item, status:'want'|'watching'|'done', season, episode, updated}
  view: 'home',
  providers: null // lista de plataformas de la región
};
function guessRegion() {

}
const demo = () => !S.key;

/* ---------- API TMDB ---------- */
const cache = new Map();

  const isBearer = S.key.length > 40;
  const u = new URL(API + path);
  u.searchParams.set('language', 'es-' + (S.region === 'ES' ? 'ES' : 'MX'));

  if (S.providers) return S.providers;
  try {
    const [m, t] = await Promise.all([tmdb('/watch/providers/movie', {
      watch_region: S.region

      watch_region: S.region

    const map = new Map();
    [...m.results, ...t.results].forEach(p => {

function provLogo(p) {
  return p.logo_path ? `<img src="${IMG}w92${p.logo_path}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">` : `<span class="pt">${esc(p.provider_name)}</span>`;
}

const titleOf = it => it.title || it.name;

async function viewHome(m) {
  const watching = Object.values(S.list).filter(e => e.status === 'watching').sort((a, b) => b.updated - a.updated).map(e => e.item);
  const want = Object.values(S.list).filter(e => e.status === 'want').sort((a, b) => b.updated - a.updated).map(e => e.item);
  const prov = S.services.join('|');
  const base = {
    watch_region: S.region,
    with_watch_providers: prov,
    with_watch_monetization_types: 'flatrate',
    sort_by: 'popularity.desc'
  };
  const [movies, shows] = await Promise.all([tmdb('/discover/movie', base), tmdb('/discover/tv', base)]);
  movies.results.forEach(r => r.media_type = 'movie');
  shows.results.forEach(r => r.media_type = 'tv');
  m.innerHTML = notice() + `<div class="chips" id="mychips">${await servicesChips(true)}</div>` + (watching.length ? `<h2>Seguir viendo</h2>${grid(watching)}` : '') + (want.length ? `<h2>En mi lista</h2>${grid(want.slice(0, 12))}` : '') + `<h2>Series populares en tus plataformas</h2>${grid(shows.results.slice(0, 18))}` + `<h2>Películas populares en tus plataformas</h2>${grid(movies.results.slice(0, 18))}`;
}
let ex = {
  type: 'tv',
  genre: '',
  sort: 'popularity.desc',
  page: 1,
  only: null
};
async function viewExplore(m, append = false) {
  if (!ex.only) ex.only = [...S.services];
  const genres = await tmdb(`/genre/${ex.type}/list`);
  const params = {
    watch_region: S.region,
    with_watch_providers: ex.only.join('|'),
    with_watch_monetization_types: 'flatrate',
